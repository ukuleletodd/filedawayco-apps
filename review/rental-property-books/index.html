<!doctype html>
<html lang="en-US">
<head>

<title>Rental Property Books by FiledAwayCo</title>

<style>:root{--navy:#1B2A40;--green:#1F5C45;--green2:#2E7A5D;--paper:#FBF8F2;--line:#E6DECF;--slate:#4A5563;--tan:#C9A46A;--red:#8A2A20;--amber:#FFF3D6;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--navy);font:16px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
header.top .logo{width:44px;height:44px;flex:none}header.top .logo svg{width:44px;height:44px;display:block}
header.top h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.3px}
header.top .by{font-size:13px;font-weight:700;color:var(--slate)}header.top .by b{color:var(--green)}
.lede{margin:2px 0 12px;color:var(--slate);font-size:15.5px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--amber);border:1.5px solid #EBD39A;border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.banner button{flex:none}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px 20px 0;margin:0 0 12px;overflow:hidden}
.hero .kick{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#9FD3B9;font-weight:800}
.hero .big{font-size:52px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 4px;word-break:break-word}
.hero .sub{color:#DCE3EC;font-size:15px;margin:0 0 14px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.16);margin:0 -20px}
.hero .stats div{padding:12px 12px 14px;border-left:1px solid rgba(255,255,255,.16)}.hero .stats div:first-child{border-left:0;padding-left:20px}
.hero .stats b{display:block;font-size:19px}.hero .stats span{font-size:13px;color:#C9D3DF}
.hero .go{display:block;width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.16);color:#fff;font:800 16px var(--ui);padding:14px;margin:0 -20px;width:calc(100% + 40px);cursor:pointer;min-height:48px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 16px;border-radius:16px;border:0;background:var(--green);color:#fff;font:800 17px var(--ui);cursor:pointer;margin:8px 0 0;text-decoration:none}
.btn.sec{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.ghost{background:transparent;color:var(--slate);border:1.5px solid var(--line);font-weight:700}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #E2C3BE}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;width:auto;padding:0 14px;margin:0}
.lnk{background:none;border:0;color:var(--green);font:800 15px var(--ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 4px;min-height:44px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 4px;font-size:18px}.card p{margin:0 0 8px;color:var(--slate);font-size:15px}
h2.sec{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--green);margin:18px 2px 8px}
.nudge{border-color:#EBD39A;background:#FFFBF0}
.nudge ul{margin:6px 0 0;padding:0;list-style:none}.nudge li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #F1E6C8;font-size:15px}.nudge li:first-child{border-top:0}
.props{display:grid;gap:10px}
.prop{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.prop b{font-size:16px}.prop small{display:block;color:var(--slate);font-size:13.5px}.prop .amt{font-weight:900;font-size:18px;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--green)}
.list{display:grid;gap:0;background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:58px}
.row:first-child{border-top:0}.row .l{min-width:0}.row b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--slate);font-size:13.5px}.row .r{font-weight:800;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:44px;font:700 15px var(--ui);color:var(--navy);cursor:pointer}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.f{display:block;font-weight:800;font-size:14.5px;margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;min-height:50px;border:1.5px solid #D6CCBA;border-radius:12px;padding:10px 12px;font:17px var(--ui);color:var(--navy);background:#fff}
input.money{font-size:30px;font-weight:900;min-height:64px}
.hint{color:var(--slate);font-size:13.5px;margin:4px 0 0}
.err{color:var(--red);font-weight:700;font-size:14.5px;margin:6px 0 0}
.three{display:grid;gap:10px}
.three button{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px;font:inherit;color:inherit;cursor:pointer}
.three button i{font-style:normal;font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF5F0;display:grid;place-items:center;flex:none}
.three b{display:block;font-size:17px}.three small{color:var(--slate);font-size:14px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
nav.bar button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--ui);color:var(--slate);min-height:52px;cursor:pointer}
nav.bar button[aria-current=page]{color:var(--green)}
nav.bar svg{width:24px;height:24px}
nav.bar .add{transform:translateY(-14px)}nav.bar .add span.c{width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,92,69,.35)}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,26,40,.45)}
.pan{width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.pan .grab{width:40px;height:5px;border-radius:3px;background:#D8D0C1;margin:0 auto 10px}
.pan h2{margin:4px 0 6px;font-size:22px}
.pan .x{float:right;margin:-4px -6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:200;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{color:#9FD3B9;background:none;border:0;font:800 15px var(--ui);margin-left:10px;cursor:pointer;text-decoration:underline;min-height:32px}
table.se{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
table.se th,table.se td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.se th:first-child,table.se td:first-child{text-align:left}
table.se td.ln{color:var(--slate);width:34px;text-align:left;font-weight:700}
table.se tr.tot td{font-weight:900;border-top:2px solid var(--navy)}
.tblwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
.trust{text-align:center;color:var(--slate);font-size:14px;margin:18px 0 0}
.note{font-size:13.5px;color:var(--slate);background:#F3EFE6;border-radius:12px;padding:10px 12px;margin:10px 0}
.thumb{max-width:100%;max-height:220px;border-radius:12px;border:1.5px solid var(--line);display:block;margin:8px 0}
.prev{max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.prev .pr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.prev .pr:first-child{border-top:0}.prev .pr label{overflow-wrap:anywhere}.prev .pr .am{text-align:right;white-space:nowrap}.prev .pr select{grid-column:2/4;width:100%;font-size:13.5px;min-height:40px;border-radius:8px;border:1px solid #D6CCBA;max-width:100%}
.prev input[type=checkbox]{width:24px;height:24px}
.drop{border:2px dashed #CFC4AE;border-radius:16px;padding:18px;text-align:center;color:var(--slate);background:#fff}
.drop.on{border-color:var(--green);background:#EEF5F0}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
@media (min-width:900px){.wrap{max-width:720px}.hero .big{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#print{display:none}
@media print{body{background:#fff}body>*:not(#print){display:none!important}#print{display:block!important;color:#000;font:10.5pt/1.35 "Helvetica Neue",Arial,sans-serif}#print th.l{text-align:left}
#print h1{font-size:18pt;margin:0 0 4pt}#print h2{font-size:13pt;margin:14pt 0 4pt;page-break-after:avoid}#print table{width:100%;border-collapse:collapse;font-size:9.5pt;page-break-inside:auto}#print th,#print td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:right}#print th:first-child,#print td:first-child,#print td.l{text-align:left}#print .sm{font-size:9pt;color:#333}#print .pb{page-break-before:always}#print tr.tot td{font-weight:bold;border-top:1pt solid #000}}

details.mon{padding:0}details.mon summary{cursor:pointer;font-weight:700;padding:14px 16px;min-height:48px;list-style-position:inside}details.mon .tblwrap{border:0;border-radius:0;margin:0}details.mon .hint{padding:0 16px 12px;margin:0}
</style>

<button type="button" data-v="tax"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Tax summary</button>
<button type="button" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>

<script>/* Rental Property Books by FiledAwayCo, v1 (2026-11-27). Everything stays on this device. Nothing is uploaded.

var S = J(g(KEY), null) || blank();
if (!S.v) S = blank();
['props','tx','trips','imports'].forEach(function(k){ if (!Array.isArray(S[k])) S[k] = []; });

    else if (n.act === 'add') txForm(null, '', n.id); else if (n.act === 'prop') propForm(S.props.filter(function(q){ return q.id === n.id; })[0]);

  else if (a === 'install' && deferred) { deferred.prompt(); deferred = null; }

});
