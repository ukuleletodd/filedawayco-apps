<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rental Property Books by FiledAwayCo</title>
<meta name="description" content="Log rent and rental costs on your phone. Every entry lands on its IRS Schedule E line, per property, ready for tax time.">
<meta name="theme-color" content="#1B2A40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rental Books">
<style>:root{--navy:#1B2A40;--green:#1F5C45;--green2:#2E7A5D;--paper:#FBF8F2;--line:#E6DECF;--slate:#4A5563;--tan:#C9A46A;--red:#8A2A20;--amber:#FFF3D6;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--navy);font:16px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
header.top .logo{width:44px;height:44px;flex:none}header.top .logo svg{width:44px;height:44px;display:block}
header.top h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.3px}
header.top .by{font-size:13px;font-weight:700;color:var(--slate)}header.top .by b{color:var(--green)}
.lede{margin:2px 0 12px;color:var(--slate);font-size:15.5px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--amber);border:1.5px solid #EBD39A;border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.banner button{flex:none}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px 20px 0;margin:0 0 12px;overflow:hidden}
.hero .kick{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#9FD3B9;font-weight:800}
.hero .big{font-size:52px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 4px;word-break:break-word}
.hero .sub{color:#DCE3EC;font-size:15px;margin:0 0 14px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.16);margin:0 -20px}
.hero .stats div{padding:12px 12px 14px;border-left:1px solid rgba(255,255,255,.16)}.hero .stats div:first-child{border-left:0;padding-left:20px}
.hero .stats b{display:block;font-size:19px}.hero .stats span{font-size:13px;color:#C9D3DF}
.hero .go{display:block;width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.16);color:#fff;font:800 16px var(--ui);padding:14px;margin:0 -20px;width:calc(100% + 40px);cursor:pointer;min-height:48px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 16px;border-radius:16px;border:0;background:var(--green);color:#fff;font:800 17px var(--ui);cursor:pointer;margin:8px 0 0;text-decoration:none}
.btn.sec{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.ghost{background:transparent;color:var(--slate);border:1.5px solid var(--line);font-weight:700}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #E2C3BE}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;width:auto;padding:0 14px;margin:0}
.lnk{background:none;border:0;color:var(--green);font:800 15px var(--ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 4px;min-height:44px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 4px;font-size:18px}.card p{margin:0 0 8px;color:var(--slate);font-size:15px}
h2.sec{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--green);margin:18px 2px 8px}
.nudge{border-color:#EBD39A;background:#FFFBF0}
.nudge ul{margin:6px 0 0;padding:0;list-style:none}.nudge li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #F1E6C8;font-size:15px}.nudge li:first-child{border-top:0}
.props{display:grid;gap:10px}
.prop{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.prop b{font-size:16px}.prop small{display:block;color:var(--slate);font-size:13.5px}.prop .amt{font-weight:900;font-size:18px;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--green)}
.list{display:grid;gap:0;background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:58px}
.row:first-child{border-top:0}.row .l{min-width:0}.row b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--slate);font-size:13.5px}.row .r{font-weight:800;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:44px;font:700 15px var(--ui);color:var(--navy);cursor:pointer}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.f{display:block;font-weight:800;font-size:14.5px;margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;min-height:50px;border:1.5px solid #D6CCBA;border-radius:12px;padding:10px 12px;font:17px var(--ui);color:var(--navy);background:#fff}
input.money{font-size:30px;font-weight:900;min-height:64px}
.hint{color:var(--slate);font-size:13.5px;margin:4px 0 0}
.err{color:var(--red);font-weight:700;font-size:14.5px;margin:6px 0 0}
.three{display:grid;gap:10px}
.three button{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px;font:inherit;color:inherit;cursor:pointer}
.three button i{font-style:normal;font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF5F0;display:grid;place-items:center;flex:none}
.three b{display:block;font-size:17px}.three small{color:var(--slate);font-size:14px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
nav.bar button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--ui);color:var(--slate);min-height:52px;cursor:pointer}
nav.bar button[aria-current=page]{color:var(--green)}
nav.bar svg{width:24px;height:24px}
nav.bar .add{transform:translateY(-14px)}nav.bar .add span.c{width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,92,69,.35)}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,26,40,.45)}
.pan{width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.pan .grab{width:40px;height:5px;border-radius:3px;background:#D8D0C1;margin:0 auto 10px}
.pan h2{margin:4px 0 6px;font-size:22px}
.pan .x{float:right;margin:-4px -6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:200;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{color:#9FD3B9;background:none;border:0;font:800 15px var(--ui);margin-left:10px;cursor:pointer;text-decoration:underline;min-height:32px}
table.se{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
table.se th,table.se td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.se th:first-child,table.se td:first-child{text-align:left}
table.se td.ln{color:var(--slate);width:34px;text-align:left;font-weight:700}
table.se tr.tot td{font-weight:900;border-top:2px solid var(--navy)}
.tblwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
.trust{text-align:center;color:var(--slate);font-size:14px;margin:18px 0 0}
.note{font-size:13.5px;color:var(--slate);background:#F3EFE6;border-radius:12px;padding:10px 12px;margin:10px 0}
.thumb{max-width:100%;max-height:220px;border-radius:12px;border:1.5px solid var(--line);display:block;margin:8px 0}
.prev{max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.prev .pr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.prev .pr:first-child{border-top:0}.prev .pr label{overflow-wrap:anywhere}.prev .pr .am{text-align:right;white-space:nowrap}.prev .pr select{grid-column:2/4;width:100%;font-size:13.5px;min-height:40px;border-radius:8px;border:1px solid #D6CCBA;max-width:100%}
.prev input[type=checkbox]{width:24px;height:24px}
.drop{border:2px dashed #CFC4AE;border-radius:16px;padding:18px;text-align:center;color:var(--slate);background:#fff}
.drop.on{border-color:var(--green);background:#EEF5F0}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
@media (min-width:900px){.wrap{max-width:720px}.hero .big{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#print{display:none}
@media print{body{background:#fff}body>*:not(#print){display:none!important}#print{display:block!important;color:#000;font:10.5pt/1.35 "Helvetica Neue",Arial,sans-serif}#print th.l{text-align:left}
#print h1{font-size:18pt;margin:0 0 4pt}#print h2{font-size:13pt;margin:14pt 0 4pt;page-break-after:avoid}#print table{width:100%;border-collapse:collapse;font-size:9.5pt;page-break-inside:auto}#print th,#print td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:right}#print th:first-child,#print td:first-child,#print td.l{text-align:left}#print .sm{font-size:9pt;color:#333}#print .pb{page-break-before:always}#print tr.tot td{font-weight:bold;border-top:1pt solid #000}}

details.mon{padding:0}details.mon summary{cursor:pointer;font-weight:700;padding:14px 16px;min-height:48px;list-style-position:inside}details.mon .tblwrap{border:0;border-radius:0;margin:0}details.mon .hint{padding:0 16px 12px;margin:0}
/* ---------- v2 ---------- */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input.srch{margin:0 0 10px;min-height:48px}
.filt{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin:10px 0 0}.filt select.in{margin:0 0 10px;min-height:48px}
@media (min-width:600px){.filt{grid-template-columns:2fr 1fr;gap:10px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.rtabs .chip{flex:none}
.chip[aria-selected=true]{background:var(--green);border-color:var(--green);color:#fff}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;padding:12px 8px}
.stats3 b{display:block;font-size:19px;font-weight:900;overflow-wrap:anywhere}.stats3 span{font-size:12.5px;color:var(--slate)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}.kv:first-of-type{border-top:0}.kv span{color:var(--slate)}.kv b{text-align:right;white-space:nowrap}
h3.ch{margin:0 0 6px;font-size:16px}h3.sec{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--green);margin:18px 2px 8px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14.5px}.brow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow b{white-space:nowrap}
.barw{display:block;height:10px;border-radius:6px;background:#EFE9DD;overflow:hidden}.barf{display:block;height:100%;background:var(--green2);border-radius:6px}.barf.neg{background:#C0574A}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:170px;padding:12px 10px 8px}
.chart .col{display:grid;grid-template-columns:1fr 1fr;gap:2px;align-items:end;height:100%;position:relative;padding-bottom:18px}
.chart .col small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--slate)}
.cb{display:block;border-radius:3px 3px 0 0;min-height:1px}.cb.in,.key.in{background:var(--green2)}.cb.out,.key.out{background:var(--tan)}
.key{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 8px}
.tbal{text-align:center;padding:14px}.tbal b{display:block;font-size:26px;font-weight:900}.tbal span{color:var(--slate);font-size:13.5px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 6px}
.mcell{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:6px 2px;font-weight:900;font-size:16px;border:1.5px solid var(--line);background:#fff}
.mcell b{font-size:12px;color:var(--slate)}.mcell small{font-size:10.5px;font-weight:700;color:var(--slate);text-align:center;line-height:1.15}
.st-paid{color:#1F5C45}.mcell.st-paid{background:#E9F4EE;border-color:#BFDCCB}
.st-late{color:#8A5A00}.mcell.st-late{background:#FFF3D6;border-color:#EBD39A}
.st-part{color:#8A5A00}.mcell.st-part{background:#FFF3D6;border-color:#EBD39A}
.st-unpaid{color:var(--red)}.mcell.st-unpaid{background:#FBE9E6;border-color:#E2C3BE}
.st-due{color:var(--slate)}
.dots{display:flex;gap:3px;margin-top:4px}.dots i{font-style:normal;font-size:11px;font-weight:900;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:#F3EFE6}
ul.ck{list-style:none;margin:0;padding:0}ul.ck li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}ul.ck li:first-child{border-top:0}
ul.ck li>span:first-child{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px}
ul.ck li.ok>span:first-child{background:#E9F4EE;color:#1F5C45}ul.ck li.no>span:first-child{background:#FFF3D6;color:#8A5A00}
ul.ck small{display:block;color:var(--slate);font-size:13px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:800 15px var(--ui);color:var(--navy);cursor:pointer;padding:6px 10px}
.tencard{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:60px}
.tencard b{display:block;font-size:16px}.tencard small{color:var(--slate);font-size:14px}.tencard>span:last-child{font-size:24px;color:var(--slate)}
/* dark mode: html.dark (auto follows the phone, or pick it in More) */
html.dark{color-scheme:dark;--navy:#E8EDF3;--green:#6FD3A6;--green2:#3E9C76;--paper:#10161F;--line:#2B3646;--slate:#AEB9C7;--tan:#C9A46A;--red:#FF9B8C;--amber:#3A3020}
html.dark body{background:var(--paper)}
html.dark .card,html.dark .prop,html.dark .list,html.dark .row,html.dark .chip,html.dark input.in,html.dark select.in,html.dark textarea.in,html.dark nav.bar,html.dark table.se,html.dark .three button,html.dark .prev,html.dark .drop,html.dark .tbtn,html.dark .mcell,html.dark .btn.sec,html.dark .btn.red{background:#18212D;color:var(--navy)}
html.dark input.in,html.dark select.in{border-color:#3A475A}
html.dark .btn{background:#1F6E50;color:#fff}html.dark .btn.sec{color:var(--green);border-color:#3E9C76}html.dark .btn.ghost{background:transparent;color:var(--slate)}html.dark .btn.red{color:var(--red);border-color:#6B3A34}
html.dark .chip[aria-pressed=true],html.dark .chip[aria-checked=true],html.dark .chip[aria-selected=true]{background:#1F6E50;border-color:#1F6E50;color:#fff}
html.dark .hero{background:#1B2A40}html.dark .toast{background:#2A3A52}html.dark .pan{background:var(--paper)}html.dark .note{background:#1E2733}html.dark .banner{border-color:#6B5A2E}
html.dark nav.bar .add span.c{background:#1F6E50}html.dark .three button i{background:#1E3329}html.dark .barw{background:#2B3646}html.dark .dots i{background:#1E2733}
html.dark .st-paid{color:#6FD3A6}html.dark .mcell.st-paid{background:#173327;border-color:#2C5A45}html.dark .st-late,html.dark .st-part{color:#F2C46B}html.dark .mcell.st-late,html.dark .mcell.st-part{background:#3A3020;border-color:#6B5A2E}html.dark .mcell.st-unpaid{background:#3A1F1C;border-color:#6B3A34}
html.dark ul.ck li.ok>span:first-child{background:#173327;color:#6FD3A6}html.dark ul.ck li.no>span:first-child{background:#3A3020;color:#F2C46B}
nav.bar button{font-size:12.5px;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><span class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="44" height="44" role="img" aria-label="FiledAwayCo logo"><rect x="6" y="6" width="228" height="228" rx="48" fill="#16283C"/><g transform="translate(63,40) scale(1.14)"><rect x="0" y="0" width="28" height="140" rx="3.2" fill="#F5F0E4"/><rect x="0" y="0" width="100" height="26" rx="3.2" fill="#F5F0E4"/><rect x="0" y="54" width="72" height="24" rx="3.2" fill="#F5F0E4"/></g><rect x="148" y="148" width="74" height="74" rx="16" fill="#E79A28" stroke="#F5F0E4" stroke-width="5"/><path d="M167.24,186.48 L180.56,199.80 L204.24,170.20" fill="none" stroke="#16283C" stroke-width="13.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><h1>Rental Property Books</h1><div class="by">by FiledAway<b>Co</b></div></div></header>
<p class="lede">Your rental income and costs, sorted onto IRS Schedule E lines for each property, ready for tax time.</p>
<div class="banner" id="sampleBar" hidden><span>These are made-up sample numbers. Anything you add now goes away when you clear it.</span><button type="button" class="lnk" data-act="clearsample">Clear sample</button></div>
<main id="main" tabindex="-1"></main>
</div>
<nav class="bar" aria-label="Main">
<button type="button" data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
<button type="button" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Log</button>
<button type="button" data-v="add" class="add" aria-label="Add rent, a cost or a trip"><span class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>

<script>/* Rental Property Books by FiledAwayCo, v2 (2026-11-27, breadth version). Everything stays on this device. Nothing is uploaded.

(function(){

/* ---------- Schedule E (Form 1040) Part I lines ---------- */

 { id:'L5', ln:'5', name:'Advertising', hint:'Listing sites, signs, ads' },
 { id:'L6', ln:'6', name:'Auto & travel', hint:'Parking, tolls, travel to the rental. Miles go in Trips' },

 { id:'L12', ln:'12', name:'Mortgage interest', hint:'Interest only, from your Form 1098 (not the whole payment)' },

/* ---------- helpers ---------- */
function $(s, r){ return (r || D).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || D).querySelectorAll(s)); }

['props','tx','trips','imports'].forEach(function(k){ if (!Array.isArray(S[k])) S[k] = []; });

function hasReal(st){ return !!(st && (st.props.length || st.tx.length || st.trips.length)); }

var idb = null;

function rclear(){ return db().then(function(d){ return new Promise(function(ok){ var t = d.transaction('r', 'readwrite'); t.objectStore('r').clear(); t.oncomplete = function(){ ok(); }; t.onerror = function(){ ok(); }; }); }).catch(function(){}); }
/* photos are shrunk to about 1600px so a year of receipts fits on a phone */
function shrink(file){
  return new Promise(function(ok, no){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = D.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);

    im.src = url; });
}
/* ---------- maths ---------- */
function inYear(d, y){ return String(d).slice(0,4) === String(y); }
/* pid: property id, '' for all, '_none' for entries with no property */
function totals(y, pid){
  var t = { RENT:0, DEP:0, IMP:0, PRIN:0, OWN:0, miles:0, mileC:0, n:0, noRate:0 }; SE_EXP.forEach(function(k){ t[k] = 0; });
  var mine = function(x){ return pid === '_none' ? !x.prop : (!pid || x.prop === pid); };
  S.tx.forEach(function(x){ if (!inYear(x.date, y) || !mine(x) || t[x.cat] == null) return; t[x.cat] += x.amt; t.n++; });
  S.trips.forEach(function(x){ if (!inYear(x.date, y) || !mine(x)) return; var r = rateFor(x.date); t.miles += +x.miles || 0; if (r == null) { t.noRate++; return; } t.mileC += Math.round((+x.miles || 0) * r); });
  t.L6all = t.L6 + t.mileC;
  t.exp = 0; SE_EXP.forEach(function(k){ t.exp += (k === 'L6' ? t.L6all : t[k]); });
  t.L13 = t.L13a + t.L13b; t.net = t.RENT - t.exp; return t; }
/* ---------- UI shell ---------- */
var view = 'home', logFilter = 'all', taxProp = '', toastT = null;
function toast(msg, undo){ var o = $('#toast'); o.innerHTML = esc(msg) + (undo ? ' <button type="button">Undo</button>' : ''); o.hidden = false;
  if (undo) $('button', o).onclick = function(){ o.hidden = true; undo(); };
  clearTimeout(toastT); toastT = setTimeout(function(){ o.hidden = true; }, undo ? 9000 : 5000); }
var lastFocus = null;
function sheet(html, onOpen){ var sh = $('#sheet'); if (sh.hidden) lastFocus = D.activeElement;
  sh.innerHTML = '<div class="pan" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><button type="button" class="lnk x" data-close>Close</button>' + html + '</div>'; sh.hidden = false;
  sh.onclick = function(e){ if (e.target === sh || e.target.closest('[data-close]')) closeSheet(); };
  var f = $('h2', sh); if (f) { f.id = 'shT'; f.tabIndex = -1; f.focus(); }
  if (onOpen) onOpen(sh); }

D.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function propName(id){ var p = S.props.filter(function(x){ return x.id === id; })[0]; return p ? p.name : 'No property picked'; }
var deferred = null;
function render(){
  $('#sampleBar').hidden = !S.sample;
  var m = $('#main');

    if (el) el.innerHTML = W.matchMedia('(display-mode: standalone)').matches ? '<p class="hint">✓ Installed on this device.</p>' : (deferred ? '<button type="button" class="btn sec" data-act="install">Install on this phone</button>' : '<p class="hint">To install: on iPhone tap Share, then <b>Add to Home Screen</b>. On Android tap ⋮, then <b>Install app</b>.</p>');
    storageNote(); }
}
/* ---------- HOME ---------- */
/* months (1-12) with no rent logged, for a rental that has a usual monthly rent */
function monthsDue(p, y){
  if (!p.rent) return []; var last = (y < TY) ? 12 : (y > TY ? 0 : NOW.getMonth() + 1), first = 1;
  if (p.since && inYear(p.since, y)) first = +p.since.slice(5,7); else if (p.since && p.since.slice(0,4) > String(y)) return [];
  var have = {}; S.tx.forEach(function(x){ if (x.prop === p.id && x.cat === 'RENT' && inYear(x.date, y)) have[+x.date.slice(5,7)] = 1; });
  var out = []; for (var i = first; i <= last; i++) if (!have[i]) out.push(i); return out; }
/* line 2 days are per tax year: p.dy = { '2026': ['365','0'] }; older saves keep p.days/p.pdays for the year they were entered */
function dz(p, y){ y = String(y || S.year); if (p.dy && p.dy[y]) return { d: p.dy[y][0] || '', pd: p.dy[y][1] || '' }; if (p.dy && Object.keys(p.dy).length) return { d: '', pd: '' }; return { d: p.days || '', pd: p.pdays || '' }; }
function noRcpt(x){ var c = CAT[x.cat] || {}; return c.kind !== 'in' && x.amt >= 7500 && !x.rcpt && ['PRIN','L12','L8'].indexOf(x.cat) < 0; }
function leftToLog(){
  var y = S.year, items = [];

    var due = monthsDue(p, y);
    if (due.length) { var ml = due[due.length - 1];
      items.push({ t: 'No rent logged for ' + due.map(function(i){ return MON[i-1]; }).join(', ') + ' at ' + p.name, a: 'Log ' + money(p.rent, true) + ' for ' + MON[ml-1], act: 'quickrent', id: p.id, m: ml }); }
    var yearly = [['L9','insurance'],['L16','property tax']]; if (p.mortgage) yearly.push(['L12','mortgage interest']);
    var miss = yearly.filter(function(c){ return !S.tx.some(function(x){ return x.prop === p.id && x.cat === c[0] && inYear(x.date, y); }); }).map(function(c){ return c[1]; });
    if (miss.length) items.push({ t: p.name + ': no ' + miss.join(' or ') + ' logged for ' + y + ' yet', a: 'Add it', act: 'add', id: p.id });
    if (p.lease && y === TY) { var dl = Math.round((new Date(p.lease + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5); if (dl <= 60 && dl >= -30) items.push({ t: p.name + ': lease ' + (dl < 0 ? 'ended ' + dshow(p.lease) : 'ends ' + dshow(p.lease) + (dl === 0 ? ' (today)' : ' (in ' + plural(dl, 'day') + ')')), a: 'Update', act: 'prop', id: p.id }); }
    if (!dz(p, y).d && (y < TY || NOW.getMonth() >= 9)) items.push({ t: p.name + ': add days rented and days you used it (Schedule E line 2)', a: 'Add days', act: 'prop', id: p.id });
  });
  var noProp = S.tx.filter(function(x){ return !x.prop && inYear(x.date, y); }).length + S.trips.filter(function(x){ return !x.prop && inYear(x.date, y); }).length;
  if (noProp && S.props.length) items.push({ t: plural(noProp, 'entry has', 'entries have') + ' no rental picked', a: 'Fix', act: 'filter', f: 'noprop' });
  var nr = S.tx.filter(function(x){ return inYear(x.date, y) && noRcpt(x); }).length;
  if (nr) items.push({ t: plural(nr, 'expense') + ' of $75 or more without a receipt photo', a: 'Show', act: 'filter', f: 'norcpt' });
  var other = S.tx.filter(function(x){ return inYear(x.date, y) && x.cat === 'L19' && !x.note; }).length;
  if (other) items.push({ t: plural(other, '"Other" expense') + ' without a note (your preparer will ask what it was)', a: 'Show', act: 'filter', f: 'other' });
  var lb = +g(LASTBK) || 0;
  if (!S.sample && hasReal(S) && Date.now() - lb > 30 * 864e5) items.push({ t: lb ? 'Your last backup file is over 30 days old' : 'You have not saved a backup file yet', a: 'Save backup', act: 'backup' });
  return items; }
function homeHTML(){
  if (!hasReal(S)) return '<div class="card"><h2>Know what your rentals really made, and have tax time done already.</h2>' +
    '<p>Log rent and costs on your phone as they happen. Every entry lands on its IRS Schedule E line, per rental, so at tax time you hand your preparer one page.</p>' +
    '<ol style="margin:6px 0 4px;padding-left:22px;color:var(--slate)"><li>Add your rental</li><li>Log rent and costs, or bring in your bank file</li><li>Tap <b>Tax summary</b> at tax time</li></ol>' +
    '<button type="button" class="btn" data-act="newprop">Add my first rental</button><button type="button" class="btn sec" data-act="sample">Try it with sample numbers</button>' +

    '<div class="big" data-k="big">' + money(t.net, true) + '</div><p class="sub">Rent in minus Schedule E expenses' + (t.mileC ? ', including ' + money(t.mileC, true) + ' of mileage' : '') + '. Before depreciation, which your preparer works out.</p>' + (function(){ var lt = totals(y - 1, ''); return lt.n || lt.miles ? '<p class="sub" data-k="ly">' + (y - 1) + ' full year: ' + money(lt.net, true) + '</p>' : ''; })() +

    (S.props.length < MAXP ? '<button type="button" class="btn ghost" data-act="newprop">+ Add a rental</button>' : '') + '</div>';
  h += '<p class="trust">🔒 Saved only on this device.<br><button type="button" class="lnk" data-act="backup">Save a backup file</button> · <button type="button" class="lnk" data-act="restore">Restore</button></p>';

/* ---------- LOG ---------- */
function entries(){ var y = S.year, a = [];

  S.trips.forEach(function(x){ if (inYear(x.date, y)) a.push({ k:'trip', x:x, d:x.date }); });

  if (!a.length) return h + '<div class="card"><p>' + (logFilter === 'all' ? 'Nothing logged for ' + S.year + ' yet. Tap + to log rent or a cost, or bring in a bank file.' : 'Nothing here. That is good news.') + '</p><button type="button" class="btn" data-act="add">+ Log something</button><button type="button" class="btn sec" data-act="import">Bring in a bank or booking file</button></div>';

  if (b.hasAttribute('data-nudge')) { var n = leftToLog()[+A('data-nudge')]; if (!n) return;
    if (n.act === 'ten') { var t3 = byId(S.tenants, n.id); if (t3) tenantSheet(t3); } else if (n.act === 'tool') { tool = n.tool; go('tools'); } return; }
  var x = A('data-x'); if (!x) return; var T = curTen(b);
  if (x === 'newten') tenantForm(); else if (x === 'tenpast') { tenPast = A('data-v2') === '1'; render(); }
  else if (x === 'cmp') { cmpKey = A('data-v2'); render(); }

  else if (x === 'xlsx') xlsxAll();

});

/* ---------- events ---------- */
D.addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b || b.closest('#sheet') && !b.hasAttribute('data-act')) return;
  var a = b.getAttribute('data-act');
  if (b.hasAttribute('data-v')) { var v = b.getAttribute('data-v'); if (v === 'add') chooseAdd(); else go(v); return; }
  if (b.hasAttribute('data-go')) { go(b.getAttribute('data-go')); return; }
  if (b.hasAttribute('data-filter')) { logFilter = b.getAttribute('data-filter'); render(); return; }

  if (b.hasAttribute('data-tp')) { taxProp = b.getAttribute('data-tp'); render(); return; }

  if (b.hasAttribute('data-prop')) { taxProp = b.getAttribute('data-prop'); go('tax'); return; }
  if (b.hasAttribute('data-editprop')) { propForm(S.props.filter(function(p){ return p.id === b.getAttribute('data-editprop'); })[0]); return; }
  if (b.hasAttribute('data-tx')) { txForm(S.tx.filter(function(x){ return x.id === b.getAttribute('data-tx'); })[0]); return; }
  if (b.hasAttribute('data-trip')) { tripForm(S.trips.filter(function(x){ return x.id === b.getAttribute('data-trip'); })[0]); return; }
  if (b.hasAttribute('data-nudge')) { var n = leftToLog()[+b.getAttribute('data-nudge')]; if (!n) return;
    if (n.act === 'quickrent') { var p = S.props.filter(function(q){ return q.id === n.id; })[0], x = { id: uid(), date: S.year + '-' + ('0' + n.m).slice(-2) + '-01', prop: p.id, cat: 'RENT', amt: p.rent, note: MON[n.m - 1] + ' rent' }; S.tx.push(x); save(); render(); toast('Logged ' + money(p.rent, true) + ' rent for ' + MON[n.m - 1] + ' at ' + p.name + '.', function(){ S.tx.splice(S.tx.indexOf(x), 1); save(); render(); }); }
    else if (n.act === 'add') txForm(null, '', n.id); else if (n.act === 'prop') propForm(S.props.filter(function(q){ return q.id === n.id; })[0]);
    else if (n.act === 'filter') { logFilter = n.f; go('log'); } else if (n.act === 'backup') saveBackup(); return; }
  if (!a) return;
  if (a === 'add') chooseAdd(); else if (a === 'newprop') propForm(); else if (a === 'sample') startSample(); else if (a === 'clearsample') clearSample();
  else if (a === 'backup') saveBackup(); else if (a === 'restore') restoreSheet(); else if (a === 'import') importSheet(); else if (a === 'undo') undoLast();
  else if (a === 'print') doPrint(); else if (a === 'csv') csvAll();
  else if (a === 'saverate') { var r = parseFloat($('#rateIn').value); if (!(r > 0 && r < 300)) { toast('Type the rate in cents, like 76.'); return; } S.rates[S.year] = r; save(); render(); toast('Mileage rate saved for ' + S.year + '.'); }
  else if (a === 'install' && deferred) { deferred.prompt(); deferred = null; }
  else if (a === 'wipe') { if (!W.confirm('Delete every rental, entry, trip and receipt photo on this device? Save a backup file first if you might want them.')) return; rm(KEY); rm(REAL); rm(UNDO); rclear(); S = blank(); save(); go('home'); toast('Everything on this device was deleted.'); }
});
