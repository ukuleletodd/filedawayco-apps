/* ---------- schedule ---------- */
function ym(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function nextInMonths(ms, from, strict){ var d = new Date(from.getFullYear(), from.getMonth(), 1); for (var i = strict ? 1 : 0; i < 30; i++) { var x = F.addM(d, i); if (ms.indexOf(x.getMonth() + 1) >= 0) return ym(x); } return ym(d); }
function hash(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function active(d){ var sys = d.profile.sys, house = d.profile.type !== 'Condo or apartment';
  return T.filter(function(x){ return !x.need || (x.need === 'house' ? house : sys[x.need]); }).map(function(x){ return Object.assign({}, x, { iv: (d.tasks[x.id] || {}).iv || x.iv }); })
    .concat(d.custom.map(function(c){ return { id: c.id, t: c.t, iv: +c.iv || 12, how: c.how || '', src: '', custom: 1 }; }))
    .filter(function(x){ return !(d.tasks[x.id] || {}).off; }); }
function dueOf(d, x){ var st = d.tasks[x.id] || {}, now = F.today(); if (st.next) return st.next;
  if (x.m && !st.iv) return nextInMonths(x.m, now, false);
  if (x.iv <= 1) return ym(now); return ym(F.addM(now, hash(x.id) % Math.min(x.iv, 6))); }
function sched(d){ var now = ym(F.today()); return active(d).map(function(x){ var due = dueOf(d, x), st = d.tasks[x.id] || {}; return Object.assign(x, { due: due, last: st.last || '', state: due < now ? 'over' : due === now ? 'now' : 'later' }); }).sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : a.t < b.t ? -1 : 1; }); }
function dueNow(d){ return rent() ? [] : sched(d).filter(function(x){ return x.state !== 'later'; }); }
function markDone(id, dateStr){ var d = F.data, x = active(d).filter(function(t){ return t.id === id; })[0]; if (!x) return; var dt = F.parseD(dateStr) || F.today(), st = d.tasks[id] = Object.assign({}, d.tasks[id]); st.last = F.ymd(dt); st.hist = [st.last].concat((st.hist || []).filter(function(x){ return x !== st.last; })).slice(0, 12);
  st.next = x.m && !st.iv ? nextInMonths(x.m, dt, true) : ym(F.addM(dt, x.iv)); }
function freqText(x){ if (x.m && !(F.data.tasks[x.id] || {}).iv) return 'Every ' + x.m.map(function(m){ return new Date(2026, m - 1, 1).toLocaleDateString('en-US', { month: 'long' }); }).join(' and '); return x.iv === 1 ? 'Every month' : x.iv === 12 ? 'Every year' : x.iv % 12 === 0 ? 'Every ' + x.iv / 12 + ' years' : 'Every ' + x.iv + ' months'; }
function wStatus(w){ var until = F.parseD(w.until); if (!until) return { k: 'ok', d: 9999 }; var days = Math.ceil((until - F.today()) / 864e5); return { k: days < 0 ? 'exp' : days <= 60 ? 'soon' : 'ok', d: days }; }
function soonW(d){ return d.warranties.filter(function(w){ return wStatus(w).k === 'soon'; }).sort(function(a, b){ return a.until < b.until ? -1 : 1; }); }

   xs.map(function(i){ return '<tr><td>' + (pst(i) === 'Done' ? esc(F.fmtD(i.date)) : esc(pst(i))) + '</td><td><b>' + esc(i.what) + '</b>' + (i.budget ? ' <span class="small">(budget ' + F.money(i.budget) + ')</span>' : '') + (todos(i).length ? '<br><span class="small">' + todos(i).map(esc).join(' · ') + '</span>' : '') + (i.notes ? '<br><span class="small">' + esc(i.notes) + '</span>' : '') + '</td><td>' + esc(i.who || '') + '</td><td>' + (i.cost ? F.money(i.cost) : '') + '</td><td>' + ((i.photos || []).length ? 'in Home Records' : '') + '</td></tr>'; }).join('') +
   '<tr><th colspan="3">Total spent</th><th>' + F.money(itot(d)) + '</th><th></th></tr></tbody></table><p class="small">Kept with Home Records by FiledAwayCo. Keep the original receipts.</p>'; }
F.on('newImpr', function(){ imprForm(); });
F.on('imprEdit', function(id){ imprForm(id); });
F.on('printImpr', function(){ F.printNow(imprHtml()); });

/* ---------- actions ---------- */
function setMode(m){ F.data.mode = m; F.save(); F.seen(); }
F.on('own', function(){ setMode('own'); if (!Object.keys(F.data.profile.sys).length) { var s = F.data.profile.sys; ['hvac', 'heat', 'ac', 'wh', 'dryer', 'dish', 'gutters', 'yard'].forEach(function(k){ s[k] = 1; }); F.save(); } F.go('profile'); F.toast('Tick what your home has, then tap Save to build your schedule.'); });
F.on('rent', function(){ setMode('rent'); F.go('home'); });
F.on('done', function(id){ var d = F.data, before = JSON.stringify(d.tasks); markDone(id); F.save(); F.refresh(); F.toast('Done. Next due ' + F.fmtM(d.tasks[id].next) + '.', 'Undo', function(){ d.tasks = JSON.parse(before); F.save(); F.refresh(); }); });
F.on('task', taskSheet);
F.on('unhide', function(){ Object.keys(F.data.tasks).forEach(function(k){ delete F.data.tasks[k].off; }); F.save(); F.refresh(); });
F.on('newTask', function(){ var p = F.sheet('Add your own task', '<label class="f" for="ctn">Task</label><input class="inp" id="ctn" placeholder="e.g. Service the pool pump"><label class="f" for="cti">Repeat</label><select class="inp" id="cti">' + [[1, 'Every month'], [3, 'Every 3 months'], [6, 'Every 6 months'], [12, 'Every year'], [24, 'Every 2 years']].map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === 12 ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select><button type="button" class="btn" id="ctgo">Add task</button><button type="button" class="btn ghost" data-close>Cancel</button>');
  p.querySelector('#ctgo').onclick = function(){ var t = p.querySelector('#ctn').value.trim(); if (!t) return p.querySelector('#ctn').focus(); var id = F.uid('c'); F.data.custom.push({ id: id, t: t, iv: +p.querySelector('#cti').value }); F.data.tasks[id] = { next: ym(F.today()) }; F.save(); F.close(true); F.go('maint'); F.toast('Added. It\'s due this month.'); }; });
F.on('newItem', function(room){ itemForm(null, room); });
F.on('item', function(id){ itemForm(id); });
F.on('room', function(r){ F.go('room', r); });
F.on('newRoom', function(){ var p = F.sheet('Add a room', '<label class="f" for="rn">Room name</label><input class="inp" id="rn" placeholder="e.g. Kids\' room"><button type="button" class="btn" id="rgo">Add room</button>'); p.querySelector('#rgo').onclick = function(){ var v = p.querySelector('#rn').value.trim(); if (!v) return; if (F.data.rooms.indexOf(v) < 0) F.data.rooms.push(v); F.save(); F.close(true); F.go('room', v); }; });
F.on('delRoom', function(r){ F.data.rooms = F.data.rooms.filter(function(x){ return x !== r; }); F.save(); F.go('inv'); });
F.on('newWarr', function(){ warrForm(); });
F.on('warrEdit', function(id){ warrForm(id); });
F.on('claim', claimSheet);
F.on('csv', function(){ if (!F.data.items.length) return F.toast('Add some inventory items first.'); F.download('Home-inventory-' + F.ymd() + '.csv', '\uFEFF' + toCsv(), 'text/csv'); F.toast('Spreadsheet saved.'); });
F.on('imp', function(){ var f = document.getElementById('impf'); f.onchange = function(){ var x = f.files[0]; f.value = ''; if (x) x.text().then(importCsv); }; f.click(); });
F.on('ics', ics);
F.on('useShared', function(){ var s = F.shared().homeInsurance, fm = document.getElementById('pf'); fm.co.value = s.co || ''; fm.pol.value = s.pol || ''; fm.agent.value = s.agent || ''; document.getElementById('shr').hidden = true; F.toast('Filled in from Family File. Tap Save to keep it.'); });
F.on('add', function(){ if (rent()) return itemForm(); var p = F.sheet('What do you want to add?', '<div class="list"><button type="button" class="it" data-p="i"><span class="ic" aria-hidden="true">📸</span><span class="tx"><b>An inventory item</b><span>Photo, value, serial number</span></span></button><button type="button" class="it" data-p="w"><span class="ic" aria-hidden="true">🧾</span><span class="tx"><b>A warranty</b><span>Get reminded before it ends</span></span></button><button type="button" class="it" data-p="t"><span class="ic" aria-hidden="true">📅</span><span class="tx"><b>A maintenance task</b><span>Something your home needs regularly</span></span></button><button type="button" class="it" data-p="m"><span class="ic" aria-hidden="true">🔨</span><span class="tx"><b>An improvement or repair</b><span>What was done, when, cost, receipt</span></span></button></div>');
  p.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ var k = b.getAttribute('data-p'); F.close(true); if (k === 'i') itemForm(); else if (k === 'w') warrForm(); else if (k === 'm') imprForm(); else F.actions.newTask(); }; }); });
F.on('wipe', function(){ F.ask('Delete everything?', 'This removes your schedule, inventory, photos and warranties from this device. Save a backup first if you might want them back.', 'Delete everything', 'Keep it', true).then(function(y){ if (!y) return; ['', '_sample', '_mode', '_seen', '_lastbk'].forEach(function(s){ localStorage.removeItem(KEY + s); }); F.ph.keys().then(function(ks){ return Promise.all(ks.map(F.ph.del)); }).then(function(){ F.load(); F.go('welcome'); F.toast('Deleted from this device.'); }); }); });
document.addEventListener('submit', function(e){ if (e.target.id !== 'pf') return; e.preventDefault(); var fm = e.target, p = F.data.profile; p.type = fm.type.value; p.year = fm.year.value.trim(); p.addr = fm.addr.value.trim(); p.owner = fm.owner.value.trim(); p.ins = { co: fm.co.value.trim(), pol: fm.pol.value.trim(), agent: fm.agent.value.trim() };
  if (!rent()) { p.sys = {}; [].slice.call(fm.querySelectorAll('[name=sys]:checked')).forEach(function(c){ p.sys[c.value] = 1; }); } F.save(); F.go('home'); F.toast(rent() ? 'Saved.' : 'Saved. Your schedule has ' + sched(F.data).length + ' tasks.'); });
document.addEventListener('click', function(e){ var b = e.target.closest('[data-mode]'); if (!b) return; F.data.mode = b.getAttribute('data-mode'); F.save(); F.refresh(); });
F.start({ slug: 'home-records', name: 'Home Records', file: 'Home-Records', key: KEY, photos: true, lockFirst: false, allLabel: 'Records', addLabel: 'Add to Home Records', backupNote: 'The backup file includes your photos, so it can be large. Save it to your cloud drive or email it to yourself.' },
  { empty: empty, normalize: normalize, count: count, valid: valid, summary: summary, sample: sample, samplePhotos: samplePhotos, onSave: onSave, after: function(v, m){ fillPhotos(m);
    if (v === 'home' && !F.data.mode) { /* never happens after welcome */ } } });
window.__HR = { sched: sched, dueNow: dueNow, markDone: markDone, T: T, total: total, wStatus: wStatus, toCsv: toCsv, parseCsv: parseCsv, claimHtml: claimHtml };
})();
</script>
</body></html>
